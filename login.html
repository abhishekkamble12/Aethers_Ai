<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to Saans · Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      width: 100vw;
      overflow-x: hidden;
      background: #0d1a19 url('mountain_bg.jpg') center/cover no-repeat fixed;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 60px;
      position: relative;
    }

    /* Ambient Overlay for depth */
    .bg-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.15), transparent 60%);
      pointer-events: none;
    }

    /* Glassmorphism Login Card matching Image 1 */
    .login-glass-card {
      width: 100%;
      max-width: 480px;
      background: rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(28px) saturate(140%);
      -webkit-backdrop-filter: blur(28px) saturate(140%);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 28px;
      padding: 44px 40px;
      box-shadow: 
        0 20px 50px rgba(13, 26, 25, 0.25),
        inset 0 1px 2px rgba(255, 255, 255, 0.6);
      position: relative;
      z-index: 10;
      animation: fadeInSlide 0.8s ease-out;
    }

    @keyframes fadeInSlide {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-title {
      font-size: 2.2rem;
      font-weight: 800;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: -0.02em;
    }

    .card-subtitle {
      font-size: 0.95rem;
      color: #334155;
      margin: 8px 0 28px;
      font-weight: 500;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 0.88rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      padding: 14px 20px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      background: rgba(255, 255, 255, 0.9);
      font-size: 0.95rem;
      color: #0f172a;
      outline: none;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .form-input::placeholder {
      color: #94a3b8;
    }

    .form-input:focus {
      background: #ffffff;
      border-color: #1b3a37;
      box-shadow: 0 0 0 3px rgba(27, 58, 55, 0.15);
    }

    .options-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 16px 4px 26px;
      font-size: 0.85rem;
    }

    .remember-label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #1e293b;
      font-weight: 600;
      cursor: pointer;
    }

    .remember-label input[type="checkbox"] {
      accent-color: #1b3a37;
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .forgot-link {
      color: #1e293b;
      font-weight: 600;
      text-decoration: none;
      transition: color 0.2s;
    }

    .forgot-link:hover {
      color: #0f172a;
      text-decoration: underline;
    }

    /* Dark Teal Button from Image 1 */
    .btn-login {
      width: 100%;
      padding: 15px;
      border-radius: 999px;
      background: #193532;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 8px 20px rgba(25, 53, 50, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
    }

    .btn-login:hover {
      background: #112624;
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(25, 53, 50, 0.45);
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 24px 0;
      color: #475569;
      font-size: 0.82rem;
      font-weight: 600;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px dashed rgba(71, 85, 105, 0.4);
    }

    .divider span {
      padding: 0 12px;
    }

    /* White Google Button from Image 1 */
    .btn-google {
      width: 100%;
      padding: 14px;
      border-radius: 999px;
      background: #ffffff;
      color: #1e293b;
      font-size: 0.95rem;
      font-weight: 700;
      border: 1px solid rgba(0, 0, 0, 0.08);
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
      text-decoration: none;
    }

    .btn-google:hover {
      background: #f8fafc;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    .google-icon {
      width: 20px;
      height: 20px;
    }

    @media (max-width: 640px) {
      body {
        padding: 20px;
        justify-content: center;
      }
      .login-glass-card {
        padding: 32px 24px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-overlay"></div>

  <!-- Glassmorphism Login Card -->
  <div class="login-glass-card">
    <h1 class="card-title">Welcome 👋</h1>
    <p class="card-subtitle">Login to access your Saans account</p>

    <form id="loginForm" onsubmit="event.preventDefault(); window.location.href='index.html';">
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input class="form-input" type="email" id="email" placeholder="mail@abc.com" required value="principal@dps.edu.in">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" type="password" id="password" placeholder="••••••••" required value="saans2026demo">
      </div>

      <div class="options-row">
        <label class="remember-label">
          <input type="checkbox" checked> Remember Me
        </label>
        <a href="#" class="forgot-link">Forgot Password?</a>
      </div>

      <button type="submit" class="btn-login">
        Login
      </button>

      <div class="divider">
        <span>or Sign in Google</span>
      </div>

      <a href="index.html" class="btn-google">
        <svg class="google-icon" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Continue with Google
      </a>
    </form>
  </div>
</body>
</html>
